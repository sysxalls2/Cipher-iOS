name: Cipher iOS Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Verifier macOS
        run: sw_vers

      - name: Verifier Xcode
        run: xcodebuild -version

      - name: Chercher le projet iOS
        run: |
          echo "=== XCODE PROJECTS ==="
          find Signal-iOS-main -name "*.xcodeproj" -print

          echo "=== XCODE WORKSPACES ==="
          find Signal-iOS-main -name "*.xcworkspace" -print
